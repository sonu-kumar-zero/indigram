services:
  postgres:
    image: postgres:17-alpine
    container_name: indigram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: indigram
      POSTGRES_PASSWORD: indigram_dev_password
      POSTGRES_DB: indigram
    ports:
      - "5432:5432"
    volumes:
      - indigram_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indigram -d indigram"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8-alpine
    container_name: indigram-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - indigram_redisdata:/data

  minio:
    image: elestio/minio:latest
    container_name: indigram-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: indigram
      MINIO_ROOT_PASSWORD: indigram_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - indigram_miniodata:/data

  media-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
    deploy:
      replicas: 2
volumes:
  indigram_pgdata:
  indigram_redisdata:
  indigram_miniodata:
