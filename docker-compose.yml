services:
  postgres:
    image: postgres:17-alpine
    container_name: indigram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: indigram
      POSTGRES_PASSWORD: indigram_dev_password
      POSTGRES_DB: indigram
    ports:
      - "5432:5432"
    volumes:
      - indigram_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indigram -d indigram"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8-alpine
    container_name: indigram-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - indigram_redisdata:/data

  minio:
    image: elestio/minio:latest
    container_name: indigram-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: indigram
      MINIO_ROOT_PASSWORD: indigram_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - indigram_miniodata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: indigram-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://indigram:indigram_dev_password@postgres:5432/indigram?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      APP_BASE_URL: http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "4000:4000"

  media-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://indigram:indigram_dev_password@postgres:5432/indigram?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    deploy:
      replicas: 2
volumes:
  indigram_pgdata:
  indigram_redisdata:
  indigram_miniodata:
